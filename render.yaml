# Render Blueprint — SDS Sentinel (single web service)
#
# Services:
#   1. sentinel-postgres  : managed PostgreSQL
#   2. sentinel-api       : web service hosting BOTH the REST/WebSocket API and
#                           the Discord bot process via scripts/start-all.mjs
#
# The dashboard is a static site (Vite build) hosted separately on GitHub Pages,
# configured at build time with VITE_API_URL pointing at this web service.
#
# Deployment constraint: the user is limited to a single Render web service,
# so the bot runs as a supervised child process inside sentinel-api instead of
# a separate background worker. The supervisor restarts the bot on crash and
# exits (triggering a platform restart) if the API process dies.
# Secrets are supplied via the Render dashboard at deploy time.

services:
  - type: postgres
    name: sentinel-postgres
    plan: free
    database: sentinel
    user: sentinel

  - type: web
    name: sentinel-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate && npm run build:api
    startCommand: npm run start:all
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_URL
        fromService:
          name: sentinel-api
          type: web
          property: url
      - key: DASHBOARD_URL
        sync: false
        # https://<username>.github.io/<repo>/ — set in the Render dashboard.
      - key: REDIRECT_URI
        fromService:
          name: sentinel-api
          type: web
          property: url
        valuePath: /api/auth/callback
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-postgres
          property: connectionString
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: SENTINEL_API_KEY
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: SENTINEL_GUILD_ALLOWLIST
        sync: false
      - key: SENTINEL_PREFIX
        value: "!"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: CSRF_ENABLED
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGINS
        sync: false
        # Comma-separated GitHub Pages origin(s), e.g.
        # https://silver-dev-studios.github.io,https://silver-dev-studios.github.io/Sentinel
      - key: SENTINEL_LOG_LEVEL
        value: info