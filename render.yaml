# Render Blueprint — SDS Sentinel
#
# Services:
#   1. sentinel-postgres  : managed PostgreSQL
#   2. sentinel-api       : web service (REST + WebSockets)
#   3. sentinel-dashboard : static site (built React bundle)
#   4. sentinel-bot       : background worker (runs the Discord gateway listener)
#
# The bot MUST run as a background worker. Do not convert it to a web service.
# Secrets are supplied via the Render dashboard at deploy time.

services:
  - type: postgres
    name: sentinel-postgres
    plan: free
    database: sentinel
    user: sentinel

  - type: web
    name: sentinel-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_URL
        fromService:
          name: sentinel-api
          type: web
          property: url
      - key: DASHBOARD_URL
        fromService:
          name: sentinel-dashboard
          type: web
          property: url
      - key: REDIRECT_URI
        fromService:
          name: sentinel-api
          type: web
          property: url
        valuePath: /api/auth/callback
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-postgres
          property: connectionString
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: SENTINEL_API_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: CSRF_ENABLED
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGINS
        fromService:
          name: sentinel-dashboard
          type: web
          property: url
      - key: SENTINEL_LOG_LEVEL
        value: info

  - type: web
    name: sentinel-dashboard
    runtime: static
    buildCommand: npm ci && npm run build -w @sds-sentinel/dashboard
    staticPublishPath: apps/dashboard/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: sentinel-api
          type: web
          property: url

  - type: worker
    name: sentinel-bot
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:bot
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: SENTINEL_GUILD_ALLOWLIST
        sync: false
      - key: SENTINEL_PREFIX
        value: "!"
      - key: SENTINEL_API_URL
        fromService:
          name: sentinel-api
          type: web
          property: url
      - key: SENTINEL_API_KEY
        fromService:
          name: sentinel-api
          type: web
          envVarKey: SENTINEL_API_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-postgres
          property: connectionString
      - key: SENTINEL_LOG_LEVEL
        value: info